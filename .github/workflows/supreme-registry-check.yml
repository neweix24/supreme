# Run strict type checks against the exact function-local Deno configuration.
name: Supreme registry function check

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/supreme-registry-api/**"
      - "supabase/functions/supreme-neweix-api/**"
      - "supabase/functions/supreme-session-api/**"
      - "services/android-attestation/supabase/functions/**"
      - ".github/workflows/supreme-registry-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/supreme-registry-api/**"
      - "supabase/functions/supreme-neweix-api/**"
      - ".github/workflows/supreme-registry-check.yml"

permissions:
  contents: read

concurrency:
  group: supreme-registry-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check registry Edge Function
        run: deno check --config supabase/functions/supreme-registry-api/deno.json supabase/functions/supreme-registry-api/index.ts
      - name: Type-check Neweix control-plane Edge Function
        run: deno check supabase/functions/supreme-neweix-api/index.ts
      - name: Type-check Supreme session Edge Function
        run: deno check supabase/functions/supreme-session-api/index.ts
      - name: Run Android attestation parser and verifier tests
        run: deno test --allow-env --allow-read services/android-attestation/supabase/functions
