name: Build Supreme Android preview APK

on:
  push:
    branches:
      - main
      - feat/supreme-native-android-login
    paths:
      - "apps/android/**"
      - ".github/workflows/supreme-android-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/supreme-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble internal test APK
        working-directory: apps/android
        env:
          # Keep preview version codes increasing so Android does not reject
          # a build as an older version when the signing certificate matches.
          SUPREME_VERSION_CODE: ${{ 1000 + github.run_number }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: supreme-android-native-preview-${{ github.run_number }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
