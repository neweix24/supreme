name: Build Supreme Android preview APK

on:
  push:
    branches:
      - main
      - feat/supreme-native-android-login
    paths:
      - "apps/android/**"
      - ".github/workflows/supreme-android-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/supreme-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-35"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: Calculate preview version code
        id: preview_version
        shell: bash
        run: echo "version_code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - name: Assemble internal test APK
        working-directory: apps/android
        env:
          # Keep preview version codes increasing across workflow runs.
          SUPREME_VERSION_CODE: ${{ steps.preview_version.outputs.version_code }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload internal test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supreme-android-native-preview-${{ github.run_number }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
