name: Supreme Android app build

on:
  push:
    branches:
      - main
      - feat/supreme-native-android-login
    paths:
      - "apps/android/**"
      - ".github/workflows/supreme-android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/supreme-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supreme-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble native Supreme debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug
